<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You are Offline - BWM KUL City Walk</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f9fafb;
      --text-main: #111827;
      --text-muted: #4b5563;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(229, 231, 235, 1);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
    .icon {
      font-size: 56px;
      margin-bottom: 24px;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 12px 0;
      color: var(--text-main);
      letter-spacing: -0.025em;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-muted);
      margin: 0 0 24px 0;
    }
    .btn {
      display: inline-block;
      background-color: var(--primary);
      color: white;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2), 0 2px 4px -1px rgba(79, 70, 229, 0.1);
      cursor: pointer;
    }
    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .notice {
      margin-top: 24px;
      border-top: 1px solid #e5e7eb;
      padding-top: 16px;
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.5;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card" role="main">
    <div class="icon" aria-hidden="true">🌐</div>
    <h1>You are offline</h1>
    <p>Reconnect to start or unlock the City Walk.</p>
    <button onclick="window.location.reload()" class="btn">Retry Connection</button>
    <div class="notice">
      Previously opened heritage information may remain available while the app is already open, but AI, directions, login, translation, and uncached map areas require internet.
    </div>
  </div>
</body>
</html>
